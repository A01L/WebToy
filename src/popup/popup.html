<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>WebToy</title>
  <link rel="stylesheet" href="../ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../../icons/logo.svg" alt="">
    <div class="brand">
      <b>WebToy</b>
      <small>Пипетка · Галерея · Шрифты</small>
    </div>
    <a class="author" href="https://github.com/A01L" target="_blank" rel="noopener" title="Автор расширения">
      <span class="gh"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></span>
      <b>A01L</b>
    </a>
  </header>

  <section class="card main">
    <div class="row">
      <div class="txt">
        <b>Навигация на сайтах</b>
        <small id="globalHint">Боковая панель видна на всех сайтах</small>
      </div>
      <label class="switch"><input type="checkbox" id="enabled"><i></i></label>
    </div>
    <div class="sep"></div>
    <div class="row">
      <div class="txt">
        <b>На этом сайте</b>
        <small id="host">-</small>
      </div>
      <label class="switch"><input type="checkbox" id="site"><i></i></label>
    </div>
  </section>

  <section class="tools">
    <button class="tool" data-tool="picker" style="--c: var(--pip)">
      <span class="ti"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.4 4.6a2.6 2.6 0 0 0-3.7 0l-2.3 2.3-1-1-1.6 1.6 1 1-7 7c-.4.4-.6.9-.6 1.4v1.6L3 20.5l.5.5 2-1.2h1.6c.5 0 1-.2 1.4-.6l7-7 1 1 1.6-1.6-1-1 2.3-2.3a2.6 2.6 0 0 0 0-3.7z"/><path d="M8.6 12.4h6"/></svg></span>
      <b>Пипетка</b><kbd>Alt+Shift+C</kbd>
    </button>
    <button class="tool" data-tool="gallery" style="--c: var(--gal)">
      <span class="ti"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><path d="M13.5 19.5l2.6-3 1.8 2 1.3-1.4 1.8 2.4"/></svg></span>
      <b>Галерея</b><kbd>Alt+Shift+G</kbd>
    </button>
    <button class="tool" data-tool="fonts" style="--c: var(--fon)">
      <span class="ti"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-14h1l5 14"/><path d="M6 14h7"/><path d="M20 11.5v7.5"/><circle cx="17.6" cy="16.2" r="2.6"/></svg></span>
      <b>Шрифты</b><kbd>Alt+Shift+F</kbd>
    </button>
  </section>

  <p class="note" id="note" hidden>На этой странице расширения не работают (служебные страницы браузера).</p>

  <footer>
    <button id="options" class="link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Настройки
    </button>
    <span class="ver">v<span id="ver"></span> · <kbd>Alt+Shift+W</kbd> вкл/выкл</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
